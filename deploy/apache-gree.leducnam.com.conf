# =====================================================================
#  gree.leducnam.com  ->  NamLeGree Ticket (Streamlit, 127.0.0.1:8501)
#
#  Bản chạy thật: E:\xampp\apache\conf\extra\httpd-gree-leducnam.conf
#  (copy từ file này; httpd.conf Include ở cuối file). Sửa ở repo rồi copy
#  sang, kiểm tra `bin\httpd.exe -t`, sau đó Stop/Start Apache.
#
#  HTTPS: chứng chỉ Let's Encrypt do mod_md tự xin + tự gia hạn (dùng chung
#  MDCertificateAgreement/MDCACertificateFile/MDContactEmail đã khai báo ở
#  httpd-hoso-anmanh.conf). Lần đầu: Start Apache -> đợi ~1 phút (xem
#  logs/error.log) -> Stop/Start Apache lần nữa để dùng chứng chỉ mới.
#  Chưa có chứng chỉ thì mod_md dùng tạm chứng chỉ tự ký (trình duyệt cảnh báo).
# =====================================================================

MDomain gree.leducnam.com

<VirtualHost *:80>
    ServerName gree.leducnam.com
    # mod_md tự trả lời /.well-known/acme-challenge/, còn lại chuyển sang https
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://gree.leducnam.com%{REQUEST_URI} [R=301,L]
    ErrorLog  "logs/gree.leducnam-error.log"
    CustomLog "logs/gree.leducnam-access.log" common
</VirtualHost>

<VirtualHost *:443>
    ServerName gree.leducnam.com
    SSLEngine on
    ProxyRequests Off
    ProxyPreserveHost On
    # Streamlit chạy qua websocket (/_stcore/stream) -> upgrade=websocket (Apache >= 2.4.47)
    ProxyPass        / http://127.0.0.1:8501/ upgrade=websocket timeout=300
    ProxyPassReverse / http://127.0.0.1:8501/
    RequestHeader set X-Forwarded-Proto "https"
    Header always set Strict-Transport-Security "max-age=31536000"
    ErrorLog  "logs/gree.leducnam-error.log"
    CustomLog "logs/gree.leducnam-access.log" common
</VirtualHost>
